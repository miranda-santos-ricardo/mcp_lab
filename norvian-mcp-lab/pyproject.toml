[project]
name = "norvian-mcp-lab"
version = "0.1.0"
description = "MCP learning lab"
readme = "README.md"
authors = [
    { name = "Ricardo Santos", email = "miranda.santos.ricardo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4,<5",
    "mcp[cli]>2,<3",
    "pydantic>2,<3",
    "pytest>=9.2.0",
]

[project.scripts]
norvian-mcp-lab = "norvian_mcp_lab:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
